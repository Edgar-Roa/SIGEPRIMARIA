<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Gobierno de México</title>
  <link rel="stylesheet" href="/static/css/headers_footers.css">
  <link rel="stylesheet" href="/static/css/registro.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>

  <header class="header">
    <div class="logo-container">
      <img src="/static/imagenes/logo2.jpg" alt="Gobierno de México logo">
    </div>
    <nav class="main-nav">
      <a href="#">Trámites</a>
      <a href="#">Gobierno</a>
      <button class="search-btn">
        <i class="fas fa-search"></i>
      </button>
    </nav>
  </header>
  
  <div class="subheader">
    <a href="{{ url_for('inicio.inicio') }}">SIGEPRIMARIA</a>
    <a href="{{ url_for('quienes_somos.quienes_somos') }}">¿Quiénes somos?</a>
  </div>

  <main class="centrado">
    <div class="form-container">
      <h2>Registro de Tutor</h2>

      <div id="flash-container" style="display:none;">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash-data" data-category="{{ category }}" data-message="{{ message }}"></div>
            {% endfor %}
          {% endif %}
        {% endwith %}
      </div>

      <form method="POST" action="{{ url_for('registro.registro') }}" autocomplete="off">
        <div class="form-field">
          <label for="nombre">Nombres del padre o tutor:</label>
          <input type="text" id="nombre" name="nombre" required>
        </div>
        <div class="form-field">
          <label for="apellido_paterno">Apellido paterno:</label>
          <input type="text" id="apellido_paterno" name="apellido_paterno" required>
        </div>
        <div class="form-field">
          <label for="apellido_materno">Apellido materno:</label>
          <input type="text" id="apellido_materno" name="apellido_materno" required>
        </div>
        <div class="form-field">
          <label for="edad">Edad:</label>
          <input type="number" id="edad" name="edad" min="18" required>
        </div>
        <div class="form-field">
          <label for="telefono">Número de teléfono/celular:</label>
          <input type="tel" id="telefono" name="telefono" required>
        </div>
        <div class="form-field">
          <label for="correo">Correo electrónico:</label>
          <input type="email" id="correo" name="correo" required>
        </div>
        <div class="form-field">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" required>
        </div>
        <div class="form-field">
          <label for="confirmar_password">Confirma la contraseña:</label>
          <input type="password" id="confirmar_password" name="confirmar_password" required>
        </div>
        <button type="submit" class="register-btn">Registrar</button>
      </form>

      <p class="login-link">¿Ya tienes una cuenta? <a href="{{ url_for('iniciar_sesion.iniciar_sesion') }}">Inicia sesión aquí</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const flashMessages = document.querySelectorAll('.flash-data');

        flashMessages.forEach(function(element) {
            const category = element.getAttribute('data-category');
            const message = element.getAttribute('data-message');
            
            // Mapeo de categorías de Flask a Iconos de SweetAlert
            let iconType = 'info';
            if (category === 'success') iconType = 'success';
            if (category === 'error') iconType = 'error';
            if (category === 'warning') iconType = 'warning';

            if (message) {
                Swal.fire({
                    toast: true,
                    position: 'bottom-end', // Esquina inferior derecha (mismo estilo que login)
                    icon: iconType,
                    title: message,
                    showConfirmButton: false,
                    timer: 5000,
                    timerProgressBar: true,
                    didOpen: (toast) => {
                        toast.addEventListener('mouseenter', Swal.stopTimer)
                        toast.addEventListener('mouseleave', Swal.resumeTimer)
                    }
                });
            }
        });
    });
  </script>

</body>
</html>
